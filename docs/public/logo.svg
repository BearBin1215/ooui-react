<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">ooui-react</title>
  <desc id="d">OOUI 的 O 外壳内含 React 电子轨道原子</desc>

  <defs>
    <!-- 内核轨道：蓝→青，呼应 React -->
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8fd0" />
      <stop offset="1" stop-color="#46c8e8" />
    </linearGradient>
    <!-- 外圈 O：藏青 → 天青 -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233566" />
      <stop offset="1" stop-color="#63bce8" />
    </linearGradient>
  </defs>

  <!-- 外圈 O = OOUI 外壳 -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="url(#shell)" stroke-width="12" />

  <!-- 壳内 React 原子（双轨道，夹角约 76°） -->
  <g fill="none" stroke="url(#core)" stroke-width="8">
    <ellipse cx="128" cy="128" rx="60" ry="24" transform="rotate(38 128 128)" />
    <ellipse cx="128" cy="128" rx="60" ry="24" transform="rotate(-38 128 128)" />
  </g>

  <!-- 原子核 -->
  <circle cx="128" cy="128" r="12" fill="#233566" />
</svg>
